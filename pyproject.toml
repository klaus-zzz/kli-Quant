[project]
name = "kli-quant"
version = "0.1.0"
description = "kli-Quant 开发骨架"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "kli-axi==0.0.13",
    "python-dotenv",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = ["httpx", "pytest", "ruff"]
# 管理 SDK 仅供可信控制端使用，不进入 CLI 模板镜像。
sandbox = ["cubesandbox==0.7.3"]

[tool.uv]
# 直接运行 backend 模块，本阶段不构建分发包。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# 本机依赖下载采用校验过的清华镜像。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
