# 仅供本地开发；避免与旧开发容器及其他项目共享资源名称。
name: kli-quant-skeleton

services:
  backend:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.12-trixie-slim
    working_dir: /app
    # 先关闭 Gateway 再回收已登记沙箱，不能被 Docker 默认的短宽限期打断。
    stop_grace_period: 60s
    command: >-
      sh -c "uv sync --locked --group sandbox &&
      exec uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 18100
      --reload --reload-dir backend"
    # 数据源配置从根 .env 加载，仅供后端使用。
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_PYTHON_INSTALL_DIR: /opt/python
      UV_CACHE_DIR: /tmp/uv-cache
      UV_HTTP_TIMEOUT: "180"
      RESEARCH_FETCHER_URL: "${RESEARCH_FETCHER_URL:-http://research-fetcher:18101/fetch}"
      KLI_QUANT_AGENT_ENV_FILE: "${KLI_QUANT_AGENT_ENV_FILE:-}"
      RESEARCH_DATABASE_URL: "${RESEARCH_DATABASE_URL:-}"
      RESEARCH_S3_ENDPOINT: "${RESEARCH_S3_ENDPOINT:-}"
      RESEARCH_S3_BUCKET: "${RESEARCH_S3_BUCKET:-}"
      RESEARCH_S3_ACCESS_KEY: "${RESEARCH_S3_ACCESS_KEY:-}"
      RESEARCH_S3_SECRET_KEY: "${RESEARCH_S3_SECRET_KEY:-}"
    volumes:
      - .:/app
      - backend-venv:/opt/venv
      - backend-python:/opt/python
      - ${KLI_QUANT_AGENT_CONFIG_DIR:-/workspace/deploy/kli-quant}:/agent-config:ro
    ports:
      - "${BACKEND_PORT:-18100}:18100"
    networks:
      docker:
        aliases: ["${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend"]
      research: {}
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

  # 抓取器不加入共享中间件网络，不挂载 .env，也不发布宿主端口。
  research-fetcher:
    build: ./fetcher
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_PYTHON_DOWNLOADS: never
      # 降权后的 uv 使用可写目录，避免访问 root 的 Python 安装目录。
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_HTTP_TIMEOUT: "180"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./fetcher:/app/fetcher:ro
      - fetcher-venv:/opt/venv
    networks:
      research: {}
      fetcher-egress:
        gw_priority: 1
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=2g"]
    cap_drop: [ALL]
    # 仅启动脚本使用这些权限，启动应用前全部撤销。
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g

  # 独立开发 Agent；外部镜像只复用已核对版本，不构建或启动生产实例。
  agent:
    profiles: [agent]
    image: aidong-backend.tencentcloudcr.com/aidong/omniagent:1.0.0a84
    pull_policy: never
    working_dir: /app
    command: [serve, --port, "8090"]
    env_file:
      - path: ${KLI_QUANT_AGENT_CONFIG_DIR:-/workspace/deploy/kli-quant}/.env
        required: false
    environment:
      # 管理身份只接本项目的窄范围适配入口，不给 Agent 集群创建权限。
      CUBESANDBOX_API_URL: http://${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend:18100/api/agent/cube
      E2B_API_KEY: ${KLI_QUANT_CONTROL_TOKEN:-}
      E2B_SANDBOX_URL: http://${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend:18100/api/agent/cube/envd
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ${KLI_QUANT_AGENT_CONFIG_DIR:-/workspace/deploy/kli-quant}/.omniagent:/app/.omniagent:ro
      - ${KLI_QUANT_AGENT_CONFIG_DIR:-/workspace/deploy/kli-quant}/certs/cube-root-ca.crt:/usr/local/share/ca-certificates/cube-root-ca.crt:ro
    dns: ["${CUBESANDBOX_DNS:-172.20.0.53}"]
    networks:
      docker:
        aliases: ["${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-agent"]

  frontend:
    image: node:24.22.2-bookworm-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_PROXY_TARGET: http://${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend:18100
    volumes:
      # 前端只挂载自身源码，无法读取根目录的数据源凭据。
      - ./frontend:/app/frontend
      - ./tests/e2e:/app/tests/e2e
      - frontend-node-modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:15173"
    networks: [docker]
    depends_on:
      backend:
        condition: service_healthy

# 依赖放入独立卷，不与宿主机的虚拟环境或 node_modules 混用。
volumes:
  backend-venv:
  backend-python:
  frontend-node-modules:
  fetcher-venv:

networks:
  research:
    internal: true
  fetcher-egress: {}
  docker:
    external: true
    name: docker
