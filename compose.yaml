# 仅供本地开发；避免与旧开发容器及其他项目共享资源名称。
name: kli-quant-skeleton

services:
  backend:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.12-trixie-slim
    working_dir: /app
    command: >-
      sh -c "uv sync --locked &&
      uv run --no-sync uvicorn backend.main:app --host 0.0.0.0 --port 18100
      --reload --reload-dir backend"
    # 数据源配置从根 .env 加载，仅供后端使用。
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_PYTHON_INSTALL_DIR: /opt/python
      UV_CACHE_DIR: /tmp/uv-cache
      UV_HTTP_TIMEOUT: "180"
      RESEARCH_FETCHER_URL: "${RESEARCH_FETCHER_URL:-http://research-fetcher:18101/fetch}"
    volumes:
      - .:/app
      - backend-venv:/opt/venv
      - backend-python:/opt/python
    ports:
      - "${BACKEND_PORT:-18100}:18100"
    networks:
      docker:
        aliases: ["${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend"]
      research: {}
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

  # 抓取器不加入共享中间件网络，不挂载 .env，也不发布宿主端口。
  research-fetcher:
    build: ./fetcher
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_PYTHON_DOWNLOADS: never
      # 降权后的 uv 使用可写目录，避免访问 root 的 Python 安装目录。
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      UV_HTTP_TIMEOUT: "180"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./fetcher:/app/fetcher:ro
      - fetcher-venv:/opt/venv
    networks:
      research: {}
      fetcher-egress:
        gw_priority: 1
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=2g"]
    cap_drop: [ALL]
    # 仅启动脚本使用这些权限，启动应用前全部撤销。
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g

  frontend:
    image: node:24.22.2-bookworm-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_PROXY_TARGET: http://${COMPOSE_PROJECT_NAME:-kli-quant-skeleton}-backend:18100
    volumes:
      # 前端只挂载自身源码，无法读取根目录的数据源凭据。
      - ./frontend:/app/frontend
      - ./tests/e2e:/app/tests/e2e
      - frontend-node-modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:15173"
    networks: [docker]
    depends_on:
      backend:
        condition: service_healthy

# 依赖放入独立卷，不与宿主机的虚拟环境或 node_modules 混用。
volumes:
  backend-venv:
  backend-python:
  frontend-node-modules:
  fetcher-venv:

networks:
  research:
    internal: true
  fetcher-egress: {}
  docker:
    external: true
    name: docker
