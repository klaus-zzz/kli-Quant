name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 专用临时库验证事务与竞态，用户名密码只用于 CI 容器。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kli_quant_test_ci
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kli_quant_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/kli_quant_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 锁文件安装、针对性回归、格式和构建是每次提交的最小检查。
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm run build
        working-directory: frontend
      # 干净检出没有私有 .env，配置检查只使用不含凭据的示例。
      - run: |
          cp .env.example .env
          docker compose config --quiet
